<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Same stock. Different days of cover.</title><desc id="desc">Illustrative scenario: 240 available units; 21-day supplier lead time</desc><rect width="1200" height="630" fill="#f6f5ef"/><rect x="64" y="64" width="56" height="8" rx="4" fill="#0d8275"/>
<text x="64" y="126" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#18323a">Same stock. Different days of cover.</text>
<text x="64" y="172" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#18323a">Illustrative scenario: 240 available units; 21-day supplier lead time</text>
<rect x="64" y="230" width="524" height="230" rx="20" fill="white" stroke="#d7e3dc"/>
<text x="88" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d8275">BASELINE / 8 UNITS A DAY</text>
<text x="88" y="346" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18323a">30 days</text>
<text x="88" y="411" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18323a">240 divided by 8</text>
<rect x="612" y="230" width="524" height="230" rx="20" fill="white" stroke="#d7e3dc"/>
<text x="636" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d8275">PROMOTION / 16 UNITS A DAY</text>
<text x="636" y="346" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18323a">15 days</text>
<text x="636" y="411" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18323a">240 divided by 16</text>
<text x="64" y="533" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#18323a">The promotion scenario runs out six days before a 21-day replenishment.</text>
<text x="64" y="586" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5a7178">THALIA TECHNOLOGIES / MERCHANT OPERATIONS</text>
</svg>