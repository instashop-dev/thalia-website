<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Build a review loop into the campaign</title><desc id="desc">Inventory planning informs a team decision, then a storefront message</desc><rect width="1200" height="630" fill="#f6f5ef"/><rect x="64" y="64" width="56" height="8" rx="4" fill="#0d8275"/>
<text x="64" y="126" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#18323a">Build a review loop into the campaign</text>
<text x="64" y="172" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#18323a">Inventory planning informs a team decision, then a storefront message</text>
<rect x="64" y="230" width="341.3333333333333" height="230" rx="20" fill="white" stroke="#d7e3dc"/>
<text x="88" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d8275">01 / ASSESS</text>
<text x="88" y="346" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18323a">Stock + demand</text>
<text x="88" y="411" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18323a">Check available units</text>
<rect x="429.3333333333333" y="230" width="341.3333333333333" height="230" rx="20" fill="white" stroke="#d7e3dc"/>
<text x="453.3333333333333" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d8275">02 / APPROVE</text>
<text x="453.3333333333333" y="346" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18323a">Offer + badge</text>
<text x="453.3333333333333" y="411" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18323a">Name the owner</text>
<rect x="794.6666666666666" y="230" width="341.3333333333333" height="230" rx="20" fill="white" stroke="#d7e3dc"/>
<text x="818.6666666666666" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d8275">03 / REVIEW</text>
<text x="818.6666666666666" y="346" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18323a">Sales + margin</text>
<text x="818.6666666666666" y="411" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18323a">Adjust and repeat</text>
<text x="64" y="533" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#18323a">Review results, update the stock plan, and check the message again.</text>
<text x="64" y="586" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5a7178">THALIA TECHNOLOGIES / MERCHANT OPERATIONS</text>
</svg>